[project]
name = "tlelo"
version = "0.1.0"
description = "Data pipeline and Elo engine for Turkish professional football leagues"
authors = [{ name = "Egemen Derbedek" }]
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
]

[project.scripts]
tlelo = "tlelo.cli:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # HTML snippets copied from real pages
